<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <h1>Interactive-Shopping-List</h1>
    
    
    <div class="input-container">
        <input type="text" id="item-input" placeholder="Item name">
        <input type="number" id="cost-input" placeholder="Price">
        <button class="submit-btn" id="add-button">Add Item</button>
    </div>

    <ul class="item-list" id="list-container"></ul>

    
    <div class="footer">
        <p>Total Cost: ksh<span id="total-display">0.00</span></p>
        <button id="clear-button">Clear List</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
